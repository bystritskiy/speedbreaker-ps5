# Deferred render-callback queue (0x82909650): lock-free producer/consumer
# across threads with no barriers (see runtime/game/render_queue.cpp).
# Release before each publish (the store of the write pointer), acquire
# before the consumer reads an entry.
[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x823C8404

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82444864

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82444968

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82444A28

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82444D5C

[[midasm_hook]]
name = "RenderQueuePublish"
address = 0x82462FB8

[[midasm_hook]]
name = "RenderQueueAcquire"
address = 0x823C8478

# Ultrawide and Vert+ (runtime/game/ultrawide.cpp): the projection's x scale,
# P[0][0], just before it is stored in the view setup (sub_8243EAC0; r28 = the
# view), and f10, the y scale the next instructions negate into P[1][1].
# (The runtime also keeps the hooks' older x-only signatures, so a ppc/
# generated before f10, f0, f2 and f4 were added still links: Hor+ only.)
[[midasm_hook]]
name = "UltrawideProjection"
address = 0x8243EFA8
registers = ["r28", "f12", "f10"]

# ... and the front-end (HUD) matrix's x and y scales (f13, f0), at the branch
# that ends its widescreen case (sub_82440D80).
[[midasm_hook]]
name = "UltrawideFrontEnd"
address = 0x82440FDC
registers = ["f13", "f0"]

# ... and the rear-view mirror's picture, a quad in pre-transformed clip
# coordinates (no matrix), at the branch that ends the widescreen case of its
# draw (sub_8245CDF0): f1 = left edge (0..1 of the screen), f2 = its top or
# bottom edge likewise, f3 = signed width, f4 = height.
[[midasm_hook]]
name = "UltrawideMirror"
address = 0x8245D068
registers = ["f1", "f2", "f3", "f4"]

# ... and the sun shadow map's fit (sub_82456030, views 1 and 2 -> 15 and 16):
# it rebuilds the camera's frustum from the camera's FOV angle and the target's
# shape, not from the projection the hook above widened, and fits the scene's
# 1600x1600 shadow map around that (narrower than the view drawn, at 16:9
# too). Before `fdivs f10,f13,f30` (P00 = 1 / tan(half the horizontal FOV)):
# f30 = that tangent, f2 / f1 = the vertical one's sine and cosine (the next
# instruction divides them), r29 = the view; the hook refits them to the
# view's stored projection.
[[midasm_hook]]
name = "UltrawideShadowFit"
address = 0x824563D0
registers = ["r29", "f30", "f2", "f1"]

# Game time in whole vblanks (runtime/game/frame_time.cpp): the frame's
# measured time (milliseconds, 16.16 fixed point) as the main loop
# (sub_823B0008) passes it to the frame (sub_823AFE20) ...
[[midasm_hook]]
name = "GameFrameTime"
address = 0x823B02D0
registers = ["r3"]

# ... the world stepper's elapsed time in steps, before it joins the
# remainder (sub_823A2348, `fadds f0,f10,f9`) ...
[[midasm_hook]]
name = "WorldStepTime"
address = 0x823A23D0
registers = ["f10"]

# ... and the steps it runs this frame, counted for the [perf] line.
[[midasm_hook]]
name = "WorldSteps"
address = 0x823A240C
registers = ["r30"]
